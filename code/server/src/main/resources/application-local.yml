# 本机没有 MySQL / Redis 时使用。数据写在 code/server/data，重启还在。
spring:
  datasource:
    url: jdbc:h2:file:./data/gym;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true

spring:
  application:
    name: gym-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

gym:
  jwt:
    admin-secret: ${JWT_ADMIN_SECRET:dev-admin-jwt-secret-key-32bytes!!}
    mp-secret: ${JWT_MP_SECRET:dev-mp-jwt-secret-key-32bytes!!!!}
    access-minutes: 120
    refresh-days: 14
    face-minutes: 30
  files:
    public-base-url: ${PUBLIC_FILE_BASE_URL:http://127.0.0.1:8080}
  map:
    tencent-key: ${TENCENT_MAP_KEY:}
  pay:
    mock-enabled: false

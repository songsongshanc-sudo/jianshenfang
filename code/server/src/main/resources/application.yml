spring:
  application:
    name: gym-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

gym:
  jwt:
    admin-secret: ${JWT_ADMIN_SECRET:dev-admin-jwt-secret-key-32bytes!!}
    mp-secret: ${JWT_MP_SECRET:dev-mp-jwt-secret-key-32bytes!!!!}
    access-minutes: 120
    refresh-days: 14
    face-minutes: 30
  files:
    public-base-url: ${PUBLIC_FILE_BASE_URL:http://127.0.0.1:8080}
    oss:
      endpoint: ${OSS_ENDPOINT:}
      bucket: ${OSS_BUCKET:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      public-base-url: ${OSS_PUBLIC_BASE_URL:}
  map:
    tencent-key: ${TENCENT_MAP_KEY:}
  wx:
    mp-appid: ${WX_MP_APPID:}
    mp-secret: ${WX_MP_SECRET:}
  pay:
    mock-enabled: false
    mch-id: ${WX_PAY_MCH_ID:}
    api-v3-key: ${WX_PAY_API_V3_KEY:}
    private-key-path: ${WX_PAY_PRIVATE_KEY_PATH:}
    mch-serial: ${WX_PAY_MCH_SERIAL:}
    notify-url: ${WX_PAY_NOTIFY_URL:}
